services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jewelry-ai-backend:latest
    container_name: jewelry-ai-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: prod
      MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      OLLAMA_URL: http://172.17.0.1:11434/api/generate
      OLLAMA_MODEL: phi3
      EMBEDDINGS_FILE: /app/embeddings.json
      CORS_ALLOW_ORIGINS: https://luvzcollection.com,https://www.luvzcollection.com
      ALLOWED_ORIGINS: https://luvzcollection.com,https://www.luvzcollection.com
      DEFAULT_RATE_LIMIT: 30/minute
      CHAT_RATE_LIMIT: 15/minute
      LLM_CONNECT_TIMEOUT_SECONDS: "10"
      LLM_READ_TIMEOUT_SECONDS: "180"
      LLM_POOL_TIMEOUT_SECONDS: "5"

    volumes:
      - ./embeddings.json:/app/embeddings.json:ro
    ports:
      - "0.0.0.0:8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - jewelry-ai

networks:
  jewelry-ai:
    driver: bridge
